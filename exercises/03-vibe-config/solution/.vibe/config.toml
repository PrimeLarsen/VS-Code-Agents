# Example Vibe Code project configuration.
# Docs: https://docs.mistral.ai/vibe/code/safety-approvals-permissions
# Vibe Code only loads this file from folders you have explicitly trusted.

# Example: tighten tool access for this project.
# enabled_tools = ["read_file", "edit", "write_file", "bash", "skill"]

# Example: disable a tool entirely for this repo.
# disabled_tools = ["bash"]

# Active example for this workshop: keep shell access, but never let the agent
# run destructive commands — even if someone asks it to "just clean up".
# Note: a denylist blocks matching commands; for a hard block, run Vibe in a sandbox.
[tools.bash]
permission = "ask"
denylist = ["rm -rf", "git push --force", "git reset --hard"]
